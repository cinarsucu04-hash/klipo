<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Google ile giriş · Klipo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
  main { width: min(360px, 90vw); text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  img { border-radius: 20px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; opacity: .8; font-size: 14px; line-height: 1.5; }
  .seg { display: flex; gap: 6px; background: #1a1a22; padding: 4px; border-radius: 12px; width: 100%; }
  .seg button { flex: 1; border: 0; border-radius: 9px; padding: 9px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
  .seg button.active { background: #fe2c55; }
  a.btn { display: inline-block; background: #fe2c55; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 24px; font-weight: 600; }
  .err { color: #ff6b81; min-height: 18px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="84" height="84">
  <h1>Klipo'ya Google ile gir</h1>
  <p id="msg">Google hesabınla giriş yap; sonra uygulamaya otomatik dönersin.</p>
  <div class="seg" id="acct"><button data-a="real" class="active">Gerçek hesap</button><button data-a="rp">RP hesabı</button></div>
  <div id="gbtn"></div>
  <a class="btn hidden" id="back" href="#">Klipo'yu aç</a>
  <div class="err" id="err" role="alert"></div>
</main>
<script src="/js/google-app.js"></script>
</body>
</html>
